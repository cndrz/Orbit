[package]
name = "orbit"
version = "2.0.0"
description = "Orbit — local-first productivity desktop app"
authors = ["you"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "orbit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri              = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-sql   = { version = "2", features = ["sqlite"] }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"

[package.metadata]

[profile.release]
panic         = "abort"
codegen-units = 1
lto           = true
opt-level     = "s"
strip         = true
